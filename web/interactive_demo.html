<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PIG Fingering Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 24px;
        color: #1f2937;
      }
      h1 { margin: 0 0 8px 0; }
      .panel {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: flex-end;
        margin-bottom: 16px;
      }
      label {
        font-size: 13px;
        color: #4b5563;
        display: block;
        margin-bottom: 4px;
      }
      input[type="number"], select {
        width: 90px;
        padding: 6px 8px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #status {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 12px;
      }
      #osmd-container {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px;
        min-height: 200px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>PIG Fingering Demo</h1>
    <div id="status">Upload a MIDI file and run inference.</div>
    <div class="panel">
      <div>
        <label for="midiFile">MIDI file</label>
        <input id="midiFile" type="file" accept=".mid,.midi" />
      </div>
      <div>
        <label for="topK">top_k</label>
        <input id="topK" type="number" value="3" min="1" max="10" />
      </div>
      <div>
        <label for="midiSplit">midi_split</label>
        <input id="midiSplit" type="number" value="60" min="0" max="127" />
      </div>
      <div>
        <label for="beam">beam search</label>
        <input id="beam" type="checkbox" />
      </div>
      <div>
        <label for="zoom">zoom</label>
        <select id="zoom">
          <option value="0.5">50%</option>
          <option value="0.7">70%</option>
          <option value="0.8">80%</option>
          <option value="1.0" selected>100%</option>
          <option value="1.2">120%</option>
        </select>
      </div>
      <button id="runBtn">Run Inference</button>
    </div>
    <div id="osmd-container"></div>

    <script>
      const statusEl = document.getElementById("status");
      const runBtn   = document.getElementById("runBtn");
      const zoomSel  = document.getElementById("zoom");

      /* ---- Create OSMD with compact drawing parameters ---- */
      const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
        autoResize: true,
        drawTitle: true,
        drawingParameters: "compact",    // tighter spacing
        drawPartNames: true,
        drawFingerings: true,
      });

      /* Rerender on zoom change */
      zoomSel.addEventListener("change", async () => {
        if (!osmd.graphic) return;           // nothing loaded yet
        osmd.zoom = parseFloat(zoomSel.value);
        await osmd.render();
      });

      async function runInference() {
        const fileInput = document.getElementById("midiFile");
        const topK      = document.getElementById("topK").value;
        const midiSplit  = document.getElementById("midiSplit").value;
        const beam       = document.getElementById("beam").checked;

        if (!fileInput.files.length) {
          statusEl.textContent = "Please select a MIDI file first.";
          return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("top_k", topK);
        formData.append("midi_split", midiSplit);
        formData.append("beam", beam ? "true" : "false");

        runBtn.disabled = true;
        statusEl.textContent = "Running inference… (music21 processing may take a few seconds)";

        try {
          const resp = await fetch("/api/infer", { method: "POST", body: formData });
          if (!resp.ok) {
            const err = await resp.text();
            throw new Error(err || "Inference failed.");
          }
          const xmlText = await resp.text();
          osmd.zoom = parseFloat(zoomSel.value);
          await osmd.load(xmlText);
          await osmd.render();
          statusEl.textContent = "Done. Fingering labels are embedded in the score.";
        } catch (err) {
          statusEl.textContent = `Error: ${err.message}`;
        } finally {
          runBtn.disabled = false;
        }
      }

      runBtn.addEventListener("click", runInference);
    </script>
  </body>
</html>
