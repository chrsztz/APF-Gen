<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PIG Fingering Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 24px;
        color: #1f2937;
      }
      h1 { margin: 0 0 8px 0; }
      .panel {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: flex-end;
        margin-bottom: 16px;
      }
      label {
        font-size: 13px;
        color: #4b5563;
        display: block;
        margin-bottom: 4px;
      }
      input[type="number"], select {
        width: 90px;
        padding: 6px 8px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #status {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 12px;
      }
      #fileTypeHint {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 2px;
      }
      #osmd-container {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px;
        min-height: 200px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>PIG Fingering Demo</h1>
    <div id="status">Upload a MIDI or PIG .txt file and run inference.</div>
    <div class="panel">
      <div>
        <label for="inputFile">File (MIDI or PIG .txt)</label>
        <input id="inputFile" type="file" />
        <div id="fileTypeHint">—</div>
      </div>
      <div>
        <label for="topK">top_k</label>
        <input id="topK" type="number" value="3" min="1" max="10" />
      </div>
      <div id="midiSplitWrap">
        <label for="midiSplit">midi_split</label>
        <input id="midiSplit" type="number" value="60" min="0" max="127" />
      </div>
      <div>
        <label for="beam">beam search</label>
        <input id="beam" type="checkbox" />
      </div>
      <div>
        <label for="zoom">zoom</label>
        <select id="zoom">
          <option value="0.5">50%</option>
          <option value="0.7">70%</option>
          <option value="0.8">80%</option>
          <option value="1.0" selected>100%</option>
          <option value="1.2">120%</option>
        </select>
      </div>
      <button id="runBtn">Run Inference</button>
    </div>
    <div id="osmd-container"></div>

    <script>
      const statusEl      = document.getElementById("status");
      const runBtn        = document.getElementById("runBtn");
      const zoomSel       = document.getElementById("zoom");
      const fileInput     = document.getElementById("inputFile");
      const fileTypeHint  = document.getElementById("fileTypeHint");
      const midiSplitWrap = document.getElementById("midiSplitWrap");

      const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
        autoResize: true,
        drawTitle: true,
        drawingParameters: "compact",
        drawPartNames: true,
        drawFingerings: true,
      });

      function isMidi(name) {
        return /\.(mid|midi)$/i.test(name);
      }
      function isTxt(name) {
        return /\.txt$/i.test(name);
      }

      fileInput.addEventListener("change", () => {
        const f = fileInput.files[0];
        if (!f) { fileTypeHint.textContent = "—"; return; }
        if (isMidi(f.name)) {
          fileTypeHint.textContent = "Detected: MIDI";
          midiSplitWrap.style.display = "";
        } else if (isTxt(f.name)) {
          fileTypeHint.textContent = "Detected: PIG txt";
          midiSplitWrap.style.display = "none";
        } else {
          fileTypeHint.textContent = "Unknown format — expected .mid/.midi or .txt";
        }
      });

      zoomSel.addEventListener("change", async () => {
        if (!osmd.graphic) return;
        osmd.zoom = parseFloat(zoomSel.value);
        await osmd.render();
      });

      async function runInference() {
        const f = fileInput.files[0];
        if (!f) {
          statusEl.textContent = "Please select a file first.";
          return;
        }

        let endpoint, formData;
        formData = new FormData();
        formData.append("file", f);
        formData.append("top_k", document.getElementById("topK").value);
        formData.append("beam", document.getElementById("beam").checked ? "true" : "false");

        if (isMidi(f.name)) {
          endpoint = "/api/infer";
          formData.append("midi_split", document.getElementById("midiSplit").value);
        } else if (isTxt(f.name)) {
          endpoint = "/api/infer_txt";
        } else {
          statusEl.textContent = "Unsupported file type. Use .mid/.midi or .txt";
          return;
        }

        runBtn.disabled = true;
        statusEl.textContent = "Running inference…";
        try {
          const resp = await fetch(endpoint, { method: "POST", body: formData });
          if (!resp.ok) {
            const err = await resp.text();
            throw new Error(err || "Inference failed.");
          }
          const xmlText = await resp.text();
          osmd.zoom = parseFloat(zoomSel.value);
          await osmd.load(xmlText);
          await osmd.render();
          statusEl.textContent = "Done. Fingering labels are embedded in the score.";
        } catch (err) {
          statusEl.textContent = `Error: ${err.message}`;
        } finally {
          runBtn.disabled = false;
        }
      }

      runBtn.addEventListener("click", runInference);
    </script>
  </body>
</html>
