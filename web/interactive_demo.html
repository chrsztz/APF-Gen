<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APF-Gen | Piano Fingering</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
    <style>
      :root {
        --bg: #f8f9fb;
        --surface: #ffffff;
        --border: #e2e5ea;
        --text: #1a1d23;
        --text-secondary: #6b7080;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-light: #eef2ff;
        --accent-muted: #c7d2fe;
        --success: #10b981;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        --radius: 12px;
        --radius-sm: 8px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* Header */
      .header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 20px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 40px;
        height: 40px;
        background: var(--accent);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
        font-weight: 700;
      }
      .header h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .header h1 span {
        color: var(--text-secondary);
        font-weight: 400;
        margin-left: 8px;
        font-size: 14px;
      }
      .header-controls {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .toggle {
        position: relative;
        width: 40px;
        height: 22px;
        appearance: none;
        background: var(--border);
        border-radius: 11px;
        cursor: pointer;
        transition: background 0.2s;
        border: none;
        outline: none;
      }
      .toggle:checked { background: var(--accent); }
      .toggle::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        top: 3px;
        left: 3px;
        transition: transform 0.2s;
        box-shadow: var(--shadow-sm);
      }
      .toggle:checked::after { transform: translateX(18px); }
      select.mini {
        font-size: 13px;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        outline: none;
      }
      select.mini:focus { border-color: var(--accent); }

      /* Main layout */
      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 32px;
      }

      /* Section titles */
      .section-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-secondary);
        margin-bottom: 14px;
      }

      /* Preset grid */
      .presets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 28px;
      }
      .preset-card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      .preset-card:hover {
        border-color: var(--accent-muted);
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }
      .preset-card.selected {
        border-color: var(--accent);
        background: var(--accent-light);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      }
      .preset-composer {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .preset-piece {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--text);
        margin-bottom: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .preset-meta {
        font-size: 11px;
        color: var(--text-secondary);
        display: flex;
        gap: 12px;
      }
      .preset-meta span {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      /* Upload area */
      .upload-row {
        display: flex;
        gap: 12px;
        align-items: stretch;
        margin-bottom: 28px;
      }
      .upload-area {
        flex: 1;
        background: var(--surface);
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 28px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 120px;
      }
      .upload-area:hover, .upload-area.dragover {
        border-color: var(--accent);
        background: var(--accent-light);
      }
      .upload-area.has-file {
        border-color: var(--success);
        border-style: solid;
        background: #ecfdf5;
      }
      .upload-icon {
        font-size: 28px;
        color: var(--text-secondary);
      }
      .upload-area.has-file .upload-icon { color: var(--success); }
      .upload-label {
        font-size: 14px;
        color: var(--text-secondary);
      }
      .upload-label strong {
        color: var(--accent);
        cursor: pointer;
      }
      .upload-hint {
        font-size: 12px;
        color: var(--text-secondary);
        opacity: 0.7;
      }
      .upload-filename {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      #fileInput { display: none; }

      /* Run button */
      .run-btn {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: var(--radius);
        padding: 0 36px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        min-width: 160px;
        letter-spacing: 0.2px;
      }
      .run-btn:hover { background: var(--accent-hover); box-shadow: var(--shadow-md); }
      .run-btn:disabled {
        opacity: 0.5;
        cursor: default;
        box-shadow: none;
      }
      .run-btn:disabled:hover { background: var(--accent); }

      /* Status bar */
      .status-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 16px;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-bar.running {
        border-color: var(--accent-muted);
        background: var(--accent-light);
        color: var(--accent);
      }
      .status-bar.done {
        border-color: #a7f3d0;
        background: #ecfdf5;
        color: #059669;
      }
      .status-bar.error {
        border-color: #fecaca;
        background: #fef2f2;
        color: #dc2626;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--accent-muted);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: none;
      }
      .status-bar.running .spinner { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Score display */
      .score-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        min-height: 250px;
        overflow-x: auto;
        box-shadow: var(--shadow-sm);
      }
      .score-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 250px;
        color: var(--text-secondary);
        gap: 8px;
      }
      .score-placeholder-icon {
        font-size: 40px;
        opacity: 0.3;
      }
      .score-placeholder-text {
        font-size: 14px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .header { padding: 16px; flex-direction: column; gap: 12px; }
        .main { padding: 16px; }
        .presets-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        .upload-row { flex-direction: column; }
        .run-btn { padding: 14px; min-width: auto; }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <div class="logo">A</div>
        <h1>APF-Gen <span>Automatic Piano Fingering</span></h1>
      </div>
      <div class="header-controls">
        <div class="control-group">
          <label for="beam">Beam Search</label>
          <input type="checkbox" id="beam" class="toggle" />
        </div>
        <div class="control-group">
          <label for="zoom">Zoom</label>
          <select id="zoom" class="mini">
            <option value="0.5">50%</option>
            <option value="0.7">70%</option>
            <option value="0.8">80%</option>
            <option value="1.0" selected>100%</option>
            <option value="1.2">120%</option>
          </select>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="section-title">Presets</div>
      <div class="presets-grid" id="presetsGrid"></div>

      <div class="section-title">Or Upload Your Own</div>
      <div class="upload-row">
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">&#9835;</div>
          <div class="upload-label"><strong>Click to browse</strong> or drag &amp; drop</div>
          <div class="upload-hint">MIDI (.mid, .midi) or PIG (.txt)</div>
        </div>
        <input type="file" id="fileInput" />
        <button class="run-btn" id="runBtn" disabled>Run Inference</button>
      </div>

      <div class="status-bar" id="statusBar">
        <div class="spinner"></div>
        <span id="statusText">Select a preset or upload a file to begin.</span>
      </div>

      <div class="score-container">
        <div class="score-placeholder" id="scorePlaceholder">
          <div class="score-placeholder-icon">&#119070;</div>
          <div class="score-placeholder-text">Sheet music will appear here</div>
        </div>
        <div id="osmd-container"></div>
      </div>
    </div>

    <script>
      const presetsGrid   = document.getElementById("presetsGrid");
      const uploadArea    = document.getElementById("uploadArea");
      const fileInput     = document.getElementById("fileInput");
      const runBtn        = document.getElementById("runBtn");
      const statusBar     = document.getElementById("statusBar");
      const statusText    = document.getElementById("statusText");
      const zoomSel       = document.getElementById("zoom");
      const placeholder   = document.getElementById("scorePlaceholder");

      let osmd = null;
      let selectedPreset = null;
      let uploadedFile = null;

      function initOSMD() {
        osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
          autoResize: true,
          drawTitle: true,
          drawingParameters: "compact",
          drawPartNames: true,
          drawFingerings: true,
        });
      }

      function setStatus(text, mode) {
        statusBar.className = "status-bar" + (mode ? " " + mode : "");
        statusText.textContent = text;
      }

      function clearSelection() {
        document.querySelectorAll(".preset-card.selected").forEach(c => c.classList.remove("selected"));
        selectedPreset = null;
      }

      function clearUpload() {
        uploadedFile = null;
        fileInput.value = "";
        uploadArea.classList.remove("has-file");
        uploadArea.innerHTML = `
          <div class="upload-icon">&#9835;</div>
          <div class="upload-label"><strong>Click to browse</strong> or drag &amp; drop</div>
          <div class="upload-hint">MIDI (.mid, .midi) or PIG (.txt)</div>
        `;
      }

      function updateRunBtn() {
        runBtn.disabled = !(selectedPreset || uploadedFile);
      }

      // --- Presets ---
      function renderPresets(presets) {
        presetsGrid.innerHTML = "";
        presets.forEach(p => {
          const card = document.createElement("div");
          card.className = "preset-card";
          card.dataset.id = p.id;
          card.innerHTML = `
            <div class="preset-composer">${p.composer}</div>
            <div class="preset-piece">${p.piece}</div>
            <div class="preset-meta">
              <span>${p.notes} notes</span>
              <span>${p.bars} bars</span>
            </div>
          `;
          card.addEventListener("click", () => {
            clearSelection();
            clearUpload();
            card.classList.add("selected");
            selectedPreset = p.id;
            updateRunBtn();
            setStatus(`Selected: ${p.composer} \u2014 ${p.piece}`, "");
          });
          presetsGrid.appendChild(card);
        });
      }

      fetch("/api/presets")
        .then(r => r.json())
        .then(renderPresets)
        .catch(() => {
          presetsGrid.innerHTML = '<div style="color:#999;font-size:13px;">Could not load presets.</div>';
        });

      // --- Upload ---
      uploadArea.addEventListener("click", () => fileInput.click());

      uploadArea.addEventListener("dragover", e => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });
      uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
      uploadArea.addEventListener("drop", e => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) handleFile(fileInput.files[0]);
      });

      function handleFile(f) {
        const valid = /\.(mid|midi|txt)$/i.test(f.name);
        if (!valid) {
          setStatus("Unsupported format. Please use .mid, .midi, or .txt", "error");
          return;
        }
        clearSelection();
        uploadedFile = f;
        uploadArea.classList.add("has-file");
        const type = /\.txt$/i.test(f.name) ? "PIG txt" : "MIDI";
        uploadArea.innerHTML = `
          <div class="upload-icon">&#10003;</div>
          <div class="upload-filename">${f.name}</div>
          <div class="upload-hint">${type} \u00b7 ${(f.size / 1024).toFixed(1)} KB</div>
        `;
        updateRunBtn();
        setStatus(`File ready: ${f.name}`, "");
      }

      // --- Inference ---
      async function runInference() {
        if (!osmd) initOSMD();
        runBtn.disabled = true;
        setStatus("Running inference\u2026", "running");
        placeholder.style.display = "none";

        try {
          let resp;
          const beam = document.getElementById("beam").checked;

          if (selectedPreset) {
            const form = new FormData();
            form.append("preset_id", selectedPreset);
            form.append("beam", beam ? "true" : "false");
            resp = await fetch("/api/infer_preset", { method: "POST", body: form });
          } else if (uploadedFile) {
            const form = new FormData();
            form.append("file", uploadedFile);
            form.append("beam", beam ? "true" : "false");
            if (/\.(mid|midi)$/i.test(uploadedFile.name)) {
              form.append("midi_split", "60");
              form.append("top_k", "3");
              resp = await fetch("/api/infer", { method: "POST", body: form });
            } else {
              form.append("top_k", "3");
              resp = await fetch("/api/infer_txt", { method: "POST", body: form });
            }
          }

          if (!resp.ok) {
            const err = await resp.text();
            throw new Error(err || "Inference failed.");
          }

          const xmlText = await resp.text();
          osmd.zoom = parseFloat(zoomSel.value);
          await osmd.load(xmlText);
          await osmd.render();
          setStatus("Fingering predictions rendered successfully.", "done");
        } catch (err) {
          setStatus(`Error: ${err.message}`, "error");
        } finally {
          updateRunBtn();
        }
      }

      runBtn.addEventListener("click", runInference);

      zoomSel.addEventListener("change", async () => {
        if (!osmd || !osmd.graphic) return;
        osmd.zoom = parseFloat(zoomSel.value);
        await osmd.render();
      });
    </script>
  </body>
</html>
